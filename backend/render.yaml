services:
  - type: web
    name: ai-recruitment-backend
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Neon (free, auto-resume tanpa pause manual). Isi manual di Render Dashboard:
      # Environment > DATABASE_URL = connection string dari Neon (pakai yang pooled,
      # sudah termasuk ?sslmode=require). psycopg2-binary sudah ada di requirements.txt.
      - key: DATABASE_URL
        sync: false
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health
