services:
  - type: web
    name: ai-recruitment-backend
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    branch: master
    buildCommand: "pip install -r requirements.txt && pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1.tar.gz"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Database Supabase (pooled). Isi manual di Render Dashboard:
      # Environment > DATABASE_URL = connection string port 6543 dari Supabase.
      # psycopg2-binary sudah ada di requirements.txt.
      - key: DATABASE_URL
        sync: false
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: UPLOAD_FOLDER
        value: /tmp/uploads
      # Isi manual: URL frontend Vercel, mis. https://ai-recruitment.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Supabase Storage (arsip CV asli, gratis 1 GB). SERVICE_KEY isi manual.
      - key: SUPABASE_URL
        value: https://aylwmmuvrtwecwifhyvi.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_CV_BUCKET
        value: cvs
    healthCheckPath: /health
