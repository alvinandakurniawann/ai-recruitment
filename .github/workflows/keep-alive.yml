# Cegah Koyeb (tidur 1 jam) & Supabase (pause 7 hari) pada tier gratis.
# Isi Secrets di GitHub repo > Settings > Secrets and variables > Actions:
#   BACKEND_URL  : mis. https://ai-recruitment-xxx.koyeb.app (tanpa slash akhir)
#   SUPABASE_URL : mis. https://xyzcompany.supabase.co
# Repo public = Actions gratis unlimited. Repo private = makan menit Actions,
# pertimbangkan cron-job.org / UptimeRobot sebagai gantinya.
name: keep-alive

on:
  schedule:
    - cron: "*/50 * * * *" # tiap 50 menit -> backend (batas tidur 1 jam)
    - cron: "0 3 */5 * *" # tiap 5 hari jam 03:00 UTC -> Supabase
  workflow_dispatch:

jobs:
  ping-backend:
    if: github.event.schedule == '*/50 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "$BACKEND_URL/health"
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

  ping-supabase:
    if: github.event.schedule == '0 3 */5 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
